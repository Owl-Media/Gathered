# Static analysis for injection, auth and data-exposure bugs.
#
# This app holds guest names, email addresses and dietary requirements, so a
# class of bug that CodeQL is good at finding is a class worth automating.
# Results appear under the repository's Security tab.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published queries run against unchanged code.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Adds the security queries that are off by default; noisier, but this
          # is a small codebase and the extra findings are worth triaging.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
