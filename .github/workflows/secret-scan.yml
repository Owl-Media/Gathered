name: Secret Scan

# Scans pushes and PRs for committed secrets (API keys, tokens, credentials).
# Complements GitHub's native secret scanning / push protection. The repo
# handles deployment secrets and E2E key material, so a committed-secret
# tripwire is worthwhile. See SECURITY_AUDIT_V2.md L2.
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # GITLEAKS_LICENSE is only required for GitHub organisation accounts.
          # Leave unset for a personal/public repo.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
