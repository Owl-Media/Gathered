# Release automation.
#
# How this works:
#
#   1. You merge conventional-commit PRs into main.
#   2. release-please keeps a single open "chore: release X.Y.Z" PR that
#      accumulates the changelog and the version bump. It rewrites that PR on
#      every merge to main, so you can watch the next release take shape.
#   3. When you merge that release PR, release-please tags the commit and
#      creates the GitHub Release.
#   4. Only then does this workflow build and publish the container image.
#
# Nothing is published until a human merges the release PR. Merging to main is
# safe and never ships anything on its own.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags and releases
      pull-requests: write # open and update the release PR
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: Publish container image
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tagged commit, not whatever main has drifted to since.
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # arm64 matters for Apple Silicon and for the cheaper ARM instances
          # most small self-hosted deployments run on.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pinned, minor and major tags let deployers choose how much
          # automatic upgrading they want. `latest` is for trying it out, not
          # for production.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.major }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=Gathered
            org.opencontainers.image.description=A deliberately private RSVP platform for small events
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Attest build provenance
        # Lets anyone verify the published image was built from this repository
        # by this workflow: gh attestation verify oci://... --repo <owner>/<repo>
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
