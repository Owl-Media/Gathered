version: 2

updates:
  # npm dependencies. Grouped so a routine week produces two PRs rather than
  # fifteen, and so CI runs a realistic combination rather than each bump alone.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      # Matches the conventional-commit check in ci.yml and keeps dependency
      # bumps in the "Build and dependencies" changelog section.
      prefix: build
      prefix-development: chore
      include: scope
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major bumps of the framework and the database layer need a human to read
      # the migration guide, not an automated PR that only proves CI is green.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: drizzle-orm
        update-types: [version-update:semver-major]

  # The actions used by the workflows above.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The Node base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
